<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image to PDF Converter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#6c8cff; --text:#eef1f7; --muted:#9aa3b2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)),
                url('StarryNightCampsite.jpg') no-repeat center center fixed;
    background-size: cover;
  }
  .card{
    background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:560px;
    box-shadow:0 10px 40px rgba(0,0,0,.4); position:relative;
  }
  h1{font-size:18px; margin:0 0 4px 0;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px 0;}

  .nav-link{
    position:absolute; top:16px; left:16px; color:var(--muted); font-size:12px;
    text-decoration:none; border:1px solid #333947; border-radius:8px; padding:6px 10px;
  }
  .nav-link:hover{color:var(--text); border-color:var(--accent);}

  /* corner button */
  .corner-btn{
    position:absolute; top:16px; right:16px;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:transform .15s, opacity .15s;
  }
  .corner-btn:disabled{opacity:.4; cursor:not-allowed;}
  .corner-btn:not(:disabled):hover{transform:translateY(-1px);}

  .dropzone{
    border:2px dashed #333947; border-radius:12px; padding:28px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; margin-top:12px;
  }
  .dropzone.drag{border-color:var(--accent); background:rgba(108,140,255,.06);}
  .dropzone input{display:none;}
  .dropzone .hint{color:var(--muted); font-size:13px; margin-top:6px;}

  .thumbs{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
  .thumb{position:relative; width:74px; height:74px; border-radius:8px; overflow:hidden; background:#000;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.7); color:#fff;
    border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1;
  }
  .count{color:var(--muted); font-size:12px; margin-top:10px;}

  /* filename modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:10;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card); border-radius:14px; padding:22px; width:90%; max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .modal h2{font-size:15px; margin:0 0 12px 0;}
  .modal input[type=text]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #333947;
    background:#111319; color:var(--text); font-size:14px; outline:none;
  }
  .modal input[type=text]:focus{border-color:var(--accent);}
  .modal .row{display:flex; gap:10px; margin-top:16px;}
  .modal button{
    flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-cancel{background:#2a2e38; color:var(--text);}
  .btn-confirm{background:var(--accent); color:#fff;}
  .ext{color:var(--muted); font-size:12px; margin-top:6px;}
  .status{font-size:12px; color:var(--muted); margin-top:14px; min-height:16px;}
</style>
</head>
<body>

<div class="card">
  <a class="nav-link" href="excel-to-pdf.html">Excel → PDF tool</a>
  <button class="corner-btn" id="convertBtn" disabled>⇩ Convert to PDF</button>
  <h1>Image → PDF</h1>
  <p class="sub">Add JPG or PNG images, then use the button in the corner to convert and download as a PDF with a name you choose.</p>

  <div class="dropzone" id="dropzone">
    <div>Click to choose files, or drag & drop here</div>
    <div class="hint">JPG / JPEG / PNG supported</div>
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple>
  </div>

  <div class="thumbs" id="thumbs"></div>
  <div class="count" id="count"></div>
  <div class="status" id="status"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Name your PDF</h2>
    <input type="text" id="filenameInput" placeholder="e.g. scanned-documents" autocomplete="off">
    <div class="ext">Saved as <span id="extPreview">my-file</span>.pdf</div>
    <div class="row">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-confirm" id="confirmBtn">Download PDF</button>
    </div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs');
const countEl = document.getElementById('count');
const convertBtn = document.getElementById('convertBtn');
const statusEl = document.getElementById('status');

const overlay = document.getElementById('overlay');
const filenameInput = document.getElementById('filenameInput');
const extPreview = document.getElementById('extPreview');
const cancelBtn = document.getElementById('cancelBtn');
const confirmBtn = document.getElementById('confirmBtn');

let images = []; // { file, dataUrl }

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(fileList) {
  const valid = Array.from(fileList).filter(f => /image\/(jpeg|png)/.test(f.type));
  valid.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      images.push({ file, dataUrl: e.target.result });
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
}

function renderThumbs() {
  thumbs.innerHTML = '';
  images.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${img.dataUrl}"><button class="rm" data-i="${i}">✕</button>`;
    thumbs.appendChild(div);
  });
  thumbs.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', () => {
      images.splice(Number(btn.dataset.i), 1);
      renderThumbs();
    });
  });
  countEl.textContent = images.length ? `${images.length} image(s) added` : '';
  convertBtn.disabled = images.length === 0;
}

// Corner button opens the filename modal BEFORE anything is downloaded
convertBtn.addEventListener('click', () => {
  filenameInput.value = '';
  extPreview.textContent = 'my-file';
  overlay.classList.add('show');
  filenameInput.focus();
});

filenameInput.addEventListener('input', () => {
  const v = sanitizeName(filenameInput.value) || 'my-file';
  extPreview.textContent = v;
});

cancelBtn.addEventListener('click', () => overlay.classList.remove('show'));

confirmBtn.addEventListener('click', async () => {
  const name = sanitizeName(filenameInput.value) || 'my-file';
  overlay.classList.remove('show');
  statusEl.textContent = 'Building PDF...';
  await buildAndDownloadPdf(name);
  statusEl.textContent = 'Done — PDF downloaded.';
});

function sanitizeName(name) {
  return name.trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 100);
}

async function buildAndDownloadPdf(filename) {
  const doc = new jsPDF({ unit: 'px' });
  let first = true;

  for (const img of images) {
    const dims = await getImageDimensions(img.dataUrl);
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    // scale image to fit page while preserving aspect ratio
    const ratio = Math.min(pageW / dims.w, pageH / dims.h);
    const w = dims.w * ratio;
    const h = dims.h * ratio;
    const x = (pageW - w) / 2;
    const y = (pageH - h) / 2;

    if (!first) doc.addPage();
    first = false;

    const format = img.file.type.includes('png') ? 'PNG' : 'JPEG';
    doc.addImage(img.dataUrl, format, x, y, w, h);
  }

  doc.save(`${filename}.pdf`);
}

function getImageDimensions(dataUrl) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve({ w: im.width, h: im.height });
    im.src = dataUrl;
  });
}
</script>
</body>
</html>
