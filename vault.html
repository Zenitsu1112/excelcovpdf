<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Family Vault</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #222630;
    --accent: #6c8cff;
    --accent-hover: #5879f5;
    --text: #eef1f7;
    --muted: #9aa3b2;
    --border: #333947;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)),
                url('assets/StarryNightCampsite.jpg') no-repeat center center fixed;
    background-size: cover;
  }

  .vault-card {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* Top Navigation */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 18px;
  }
  .nav-link {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav-link:hover { color: var(--text); border-color: var(--accent); }
  .user-badge {
    font-size: 12px;
    color: var(--accent);
    background: rgba(108, 140, 255, 0.1);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(108, 140, 255, 0.2);
    font-weight: 600;
  }

  /* Authentication */
  .auth-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: #111319;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .auth-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-tab.active { background: var(--accent); color: #fff; }

  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .input-group input {
    width: 100%;
    padding: 12px;
    background: #111319;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .input-group input:focus { border-color: var(--accent); }

  .btn-main {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn-main:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-main:disabled { opacity: 0.45; cursor: not-allowed; }

  .hidden { display: none !important; }

  /* Staged Upload Area */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.01);
    margin-bottom: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(108, 140, 255, 0.08); }
  .dropzone input { display: none; }
  .dropzone .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .selected-preview-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(108, 140, 255, 0.12);
    border: 1px solid rgba(108, 140, 255, 0.3);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-top: 6px;
    max-width: 90%;
  }
  .selected-preview-pill span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .selected-preview-pill button {
    background: transparent;
    border: none;
    color: var(--danger);
    font-weight: bold;
    cursor: pointer;
  }

  /* Hardware-level Progress Bar */
  .progress-wrapper {
    margin-top: 10px;
    background: #111319;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #232732;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.1s ease-out;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--muted);
  }

  /* Search Engine */
  .search-container {
    display: flex;
    gap: 8px;
    margin: 18px 0 14px 0;
  }
  .search-wrapper {
    position: relative;
    flex: 1;
  }
  .search-wrapper input {
    width: 100%;
    padding: 9px 32px 9px 12px;
    background: #111319;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-wrapper input:focus { border-color: var(--accent); }
  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    display: none;
  }
  .search-clear.show { display: block; }
  .btn-search {
    background: var(--card-hover);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  /* Medium Cards Grid */
  .files-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .files-grid::-webkit-scrollbar { width: 5px; }
  .files-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .file-card {
    background: #111319;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s, border-color 0.15s;
  }
  .file-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .file-preview {
    width: 100%;
    height: 95px;
    background: #161922;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    overflow: hidden;
    position: relative;
  }
  .file-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .file-preview .file-icon {
    font-size: 38px;
    user-select: none;
  }

  .file-details {
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .file-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .file-size {
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
  }
  .btn-card {
    flex: 1;
    text-align: center;
    background: var(--card-hover);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 0;
    font-size: 11px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-card:hover { border-color: var(--accent); color: var(--accent); }
  .btn-card.del:hover { border-color: var(--danger); color: var(--danger); }

  .status-text {
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
    color: var(--muted);
    min-height: 16px;
  }
  .status-text.success { color: var(--success); }
  .status-text.error { color: var(--danger); }

  .brand-footer {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    body { padding: 10px; background-attachment: scroll; }
    .vault-card { padding: 18px 14px; }
    .files-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .file-preview { height: 85px; }
  }
</style>
</head>
<body>

<div class="vault-card">
  <div class="top-bar">
    <a class="nav-link" href="index.html">← All Tools</a>
    <div id="userBadge" class="user-badge hidden"></div>
    <button id="logoutBtn" class="btn-card" style="flex: initial; padding: 6px 12px;">Log Out</button>
  </div>

  <!-- AUTHENTICATION VIEW -->
  <div id="authSection">
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Google Drive Vault</h1>
    <p style="color: var(--muted); font-size: 13px; margin-bottom: 18px;">Private cloud storage backed by 5 TB Drive capacity.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">Log In</button>
      <button type="button" class="auth-tab" id="tabRegister">New Account</button>
    </div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="e.g. 123" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password">
    </div>

    <button type="button" class="btn-main" id="authSubmitBtn">Log In</button>
    <div class="status-text" id="authStatus"></div>
  </div>

  <!-- VAULT DASHBOARD -->
  <div id="vaultSection" class="hidden">
    <!-- Staged Upload Zone -->
    <div class="dropzone" id="dropzone">
      <div id="dropzoneDefault">
        <div style="font-size: 13px; font-weight: 500;">Click or drop file to select</div>
        <div class="hint">Images, PDFs, ZIPs, Videos up to 1 GB</div>
      </div>
      <div id="dropzoneSelected" class="hidden">
        <div class="selected-preview-pill">
          📄 <span id="stagedFileName">file.png</span> (<span id="stagedFileSize">0 KB</span>)
          <button type="button" id="clearStagedBtn" title="Remove selection">✕</button>
        </div>
      </div>
      <input type="file" id="fileInput">
    </div>

    <!-- Upload Action & Live Progress -->
    <button type="button" class="btn-main" id="uploadBtn" disabled>Upload to Drive</button>

    <div id="progressWrapper" class="progress-wrapper hidden">
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div class="progress-text">
        <span id="progressState">Connecting...</span>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <!-- Search Engine -->
    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search files by name..." autocomplete="off">
        <button type="button" class="search-clear" id="searchClear">✕</button>
      </div>
      <button type="button" class="btn-search" id="searchBtn">Search</button>
    </div>

    <!-- Medium File Card Grid -->
    <div class="files-grid" id="filesGrid"></div>
    <div class="status-text" id="vaultStatus"></div>
  </div>

  <div class="brand-footer">
    Created & Owned by <strong style="color: var(--text);">Ranjan</strong>
  </div>
</div>

<script>
// --- PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQyfNa680O4ZnymK6WPQqbkwaVhuPQHbJ0g8gUGJ-V7-Gl9_cYqTX4gWTEl3xxKa0T0g/exec";
// -----------------------------------------------------

let isLoginMode = true;
let currentUser = null;
let currentPass = null;
let allFiles = [];
let stagedFile = null;

const authSection = document.getElementById('authSection');
const vaultSection = document.getElementById('vaultSection');
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const usernameInput = document.getElementById('usernameInput');
const passwordInput = document.getElementById('passwordInput');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authStatus = document.getElementById('authStatus');
const userBadge = document.getElementById('userBadge');
const logoutBtn = document.getElementById('logoutBtn');

const dropzone = document.getElementById('dropzone');
const dropzoneDefault = document.getElementById('dropzoneDefault');
const dropzoneSelected = document.getElementById('dropzoneSelected');
const stagedFileName = document.getElementById('stagedFileName');
const stagedFileSize = document.getElementById('stagedFileSize');
const clearStagedBtn = document.getElementById('clearStagedBtn');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');

const progressWrapper = document.getElementById('progressWrapper');
const progressBar = document.getElementById('progressBar');
const progressState = document.getElementById('progressState');
const progressPct = document.getElementById('progressPct');

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchBtn = document.getElementById('searchBtn');
const filesGrid = document.getElementById('filesGrid');
const vaultStatus = document.getElementById('vaultStatus');

tabLogin.addEventListener('click', () => {
  isLoginMode = true;
  tabLogin.classList.add('active');
  tabRegister.classList.remove('active');
  authSubmitBtn.textContent = 'Log In';
  authStatus.textContent = '';
});

tabRegister.addEventListener('click', () => {
  isLoginMode = false;
  tabRegister.classList.add('active');
  tabLogin.classList.remove('active');
  authSubmitBtn.textContent = 'Create User & Folder';
  authStatus.textContent = '';
});

authSubmitBtn.addEventListener('click', async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  if (!username || !password) {
    authStatus.textContent = 'Please enter both username and password.';
    return;
  }

  authSubmitBtn.disabled = true;
  authStatus.textContent = isLoginMode ? 'Verifying credentials...' : 'Provisioning Drive folder...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: isLoginMode ? 'login' : 'register', username, password })
    });
    const data = await res.json();

    if (!data.success) {
      authStatus.textContent = data.message;
      authSubmitBtn.disabled = false;
      return;
    }

    currentUser = username;
    currentPass = password;

    if (!isLoginMode) {
      alert(`User "${username}" created! Logging you in...`);
      const loginRes = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username, password })
      });
      const loginData = await loginRes.json();
      allFiles = loginData.files || [];
    } else {
      allFiles = data.files || [];
    }

    showVault();
  } catch (err) {
    authStatus.textContent = 'Connection error: ' + err.message;
  } finally {
    authSubmitBtn.disabled = false;
  }
});

function showVault() {
  authSection.classList.add('hidden');
  vaultSection.classList.remove('hidden');
  userBadge.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');
  userBadge.textContent = `User: ${currentUser}`;
  renderGrid(allFiles);
}

logoutBtn.addEventListener('click', () => location.reload());

// Staging (Up to 1 GB limit)
dropzone.addEventListener('click', (e) => {
  if (e.target !== clearStagedBtn) fileInput.click();
});
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) stageFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) stageFile(fileInput.files[0]);
});

function stageFile(file) {
  const MAX_SIZE_MB = 1024; // 1 GB ceiling
  if (file.size > MAX_SIZE_MB * 1024 * 1024) {
    alert(`File exceeds maximum ${MAX_SIZE_MB} MB limit.`);
    return;
  }
  stagedFile = file;
  stagedFileName.textContent = file.name;
  stagedFileSize.textContent = formatBytes(file.size);
  dropzoneDefault.classList.add('hidden');
  dropzoneSelected.classList.remove('hidden');
  uploadBtn.disabled = false;
  uploadBtn.textContent = `Upload "${file.name}" to Drive`;
}

clearStagedBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  clearStagedFile();
});

function clearStagedFile() {
  stagedFile = null;
  fileInput.value = '';
  dropzoneDefault.classList.remove('hidden');
  dropzoneSelected.classList.add('hidden');
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Upload to Drive';
}

// Resumable Direct Upload Pipeline (Fixes Network Error & Supports 1 GB)
uploadBtn.addEventListener('click', async () => {
  if (!stagedFile) return;

  uploadBtn.disabled = true;
  progressWrapper.classList.remove('hidden');
  progressBar.style.width = '0%';
  progressPct.textContent = '0%';
  progressState.textContent = 'Requesting Drive upload slot...';

  try {
    // 1. Fetch direct resumable URL from Apps Script via fetch (handles 302 cleanly)
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'getUploadUrl',
        username: currentUser,
        password: currentPass,
        fileName: stagedFile.name,
        mimeType: stagedFile.type || 'application/octet-stream',
        fileSize: stagedFile.size
      })
    });

    const ticket = await res.json();
    if (!ticket.success) throw new Error(ticket.message);

    // 2. Stream binary directly to Google Drive (No redirect, no network error)
    streamFileDirectly(ticket.uploadUrl, stagedFile);

  } catch (err) {
    vaultStatus.className = 'status-text error';
    vaultStatus.textContent = 'Upload error: ' + err.message;
    progressWrapper.classList.add('hidden');
    uploadBtn.disabled = false;
  }
});

function streamFileDirectly(uploadUrl, file) {
  const xhr = new XMLHttpRequest();
  xhr.open('PUT', uploadUrl, true);
  xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

  // Real-time byte tracking directly to Google servers
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = `${pct}%`;
      progressPct.textContent = `${pct}%`;
      progressState.textContent = `Uploading: ${formatBytes(e.loaded)} / ${formatBytes(e.total)}`;
    }
  };

  xhr.onload = () => {
    if (xhr.status === 200 || xhr.status === 201) {
      progressBar.style.width = '100%';
      progressPct.textContent = '100%';
      progressState.textContent = 'Saved to Drive!';
      vaultStatus.className = 'status-text success';
      vaultStatus.textContent = `✓ "${file.name}" uploaded successfully.`;
      clearStagedFile();
      refreshFiles();
    } else {
      vaultStatus.className = 'status-text error';
      vaultStatus.textContent = `Drive upload rejected with status ${xhr.status}`;
    }
    setTimeout(() => progressWrapper.classList.add('hidden'), 2500);
    uploadBtn.disabled = false;
  };

  xhr.onerror = () => {
    vaultStatus.className = 'status-text error';
    vaultStatus.textContent = 'Direct upload connection interrupted.';
    progressWrapper.classList.add('hidden');
    uploadBtn.disabled = false;
  };

  xhr.send(file);
}

async function refreshFiles() {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', username: currentUser, password: currentPass })
  });
  const data = await res.json();
  if (data.success) {
    allFiles = data.files || [];
    filterFiles();
  }
}

// Live Search Handlers
searchInput.addEventListener('input', () => {
  searchClear.classList.toggle('show', searchInput.value.length > 0);
  filterFiles();
});

searchBtn.addEventListener('click', filterFiles);

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  filterFiles();
});

function filterFiles() {
  const query = searchInput.value.toLowerCase().trim();
  if (!query) {
    renderGrid(allFiles);
    return;
  }
  const filtered = allFiles.filter(f => f.name.toLowerCase().includes(query));
  renderGrid(filtered);
}

function renderGrid(files) {
  filesGrid.innerHTML = '';
  if (!files.length) {
    filesGrid.innerHTML = '<div style="grid-column: 1/-1; font-size: 12.5px; color: var(--muted); text-align: center; padding: 24px;">No files found in folder.</div>';
    return;
  }

  files.forEach(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    const isImg = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg'].includes(ext);

    const card = document.createElement('div');
    card.className = 'file-card';

    let previewHtml = '';
    if (isImg) {
      previewHtml = `
        <img src="https://drive.google.com/thumbnail?id=${f.id}&sz=w300" 
             loading="lazy" 
             alt="${f.name}" 
             onerror="this.parentElement.innerHTML='<span class=\\'file-icon\\'>🖼️</span>'">
      `;
    } else {
      const icon = getFileIcon(ext);
      previewHtml = `<span class="file-icon">${icon}</span>`;
    }

    card.innerHTML = `
      <div class="file-preview">
        ${previewHtml}
      </div>
      <div class="file-details">
        <div>
          <div class="file-title" title="${f.name}">${f.name}</div>
          <div class="file-size">${formatBytes(f.size)}</div>
        </div>
        <div class="card-actions">
          <a class="btn-card" href="${f.url}" target="_blank">View</a>
          <button class="btn-card del" data-id="${f.id}">✕</button>
        </div>
      </div>
    `;

    filesGrid.appendChild(card);
  });

  filesGrid.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Move this file to Google Drive trash?')) return;
      vaultStatus.textContent = 'Deleting file...';
      const fileId = btn.dataset.id;

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', fileId })
      });

      refreshFiles();
    });
  });
}

function getFileIcon(ext) {
  if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
  if (ext === 'pdf') return '📄';
  if (['xlsx', 'xls', 'csv'].includes(ext)) return '📊';
  if (['doc', 'docx', 'txt', 'rtf'].includes(ext)) return '📝';
  if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return '🎵';
  if (['mp4', 'mkv', 'avi', 'mov'].includes(ext)) return '🎬';
  if (['js', 'html', 'css', 'py', 'json', 'cpp'].includes(ext)) return '💻';
  return '📁';
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 KB';
  const k = 1024;
  if (bytes < k * 1024) return (bytes / k).toFixed(1) + ' KB';
  if (bytes < k * k * 1024) return (bytes / (k * k)).toFixed(2) + ' MB';
  return (bytes / (k * k * k)).toFixed(2) + ' GB';
}
</script>
