<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Excel → PDF Converter</title>
  <!-- Client-side Unzipper & Direct PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #222630;
      --accent: #6c8cff;
      --accent-hover: #5879f5;
      --text: #eef1f7;
      --muted: #9aa3b2;
      --border: #333947;
      --success: #22c55e;
      --success-hover: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)),
                  url('assets/StarryNightCampsite.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-link {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(108, 140, 255, 0.08);
    }

    .corner-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s, opacity 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .corner-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .corner-btn:not(:disabled):hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .corner-btn.ready {
      background: var(--success);
    }
    .corner-btn.ready:not(:disabled):hover {
      background: var(--success-hover);
    }

    /* Typography */
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.3px;
    }
    p.sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 16px 0;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: rgba(255, 255, 255, 0.01);
      margin-bottom: 16px;
    }
    .dropzone.drag {
      border-color: var(--accent);
      background: rgba(108, 140, 255, 0.08);
    }
    .dropzone input { display: none; }
    .dropzone .primary-txt {
      font-size: 13px;
      font-weight: 500;
    }
    .dropzone .hint {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 6px;
    }
    .selected-file-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: rgba(108, 140, 255, 0.12);
      border: 1px solid rgba(108, 140, 255, 0.25);
      border-radius: 6px;
      color: #8fa7ff;
      font-size: 12px;
      font-weight: 500;
      word-break: break-all;
    }

    /* Action & Status */
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      min-height: 16px;
      text-align: center;
    }
    .status.success { color: var(--success); font-weight: 500; }
    .status.error { color: #f87171; }

    /* Ownership Footer */
    .brand-footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.3px;
      user-select: none;
    }
    .brand-footer .owner-name {
      color: var(--text);
      font-weight: 600;
    }

    /* Filename Modal Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
    }
    .modal h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    .modal input[type=text] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #111319;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input[type=text]:focus {
      border-color: var(--accent);
    }
    .modal .row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal button {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-cancel {
      background: #2a2e38;
      color: var(--text);
    }
    .btn-confirm {
      background: var(--accent);
      color: #fff;
    }
    .ext {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      word-break: break-all;
    }

    /* Hidden rendering container for html2pdf */
    #renderContainer {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1100px;
    }

    /* Responsive Breakpoints */
    @media (max-width: 480px) {
      body {
        padding: 12px;
        background-attachment: scroll;
      }
      .card {
        padding: 18px 16px 14px;
        border-radius: 14px;
      }
      h1 { font-size: 18px; }
      .dropzone { padding: 20px 12px; }
    }

    @media (max-width: 360px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-link, .corner-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a class="nav-link" href="index.html">
      <span>←</span> All Tools
    </a>
    <button class="corner-btn" id="actionBtn" disabled>
      ⇩ Convert to PDF
    </button>
  </div>

  <h1>Portal Excel → PDF</h1>
  <p class="sub">Converts portal exports (.xlsx) safely bypassing XML NaN errors.</p>

  <!-- Drag & Drop Zone -->
  <div class="dropzone" id="dropzone">
    <div class="primary-txt" id="dropzoneMainText">Click to choose file, or drag & drop here</div>
    <div class="hint">Supports e-Vidyavahini & HRMS spreadsheet exports (.xlsx)</div>
    <div id="fileBadgeContainer"></div>
    <input type="file" id="fileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  </div>

  <div class="status" id="statusMessage"></div>

  <!-- Ownership Footer -->
  <div class="brand-footer">
    Created & Owned by <span class="owner-name">Ranjan</span>
  </div>
</div>

<!-- Filename Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Name your PDF</h2>
    <input type="text" id="filenameInput" placeholder="e.g. leave-record-report" autocomplete="off">
    <div class="ext">Saved as <span id="extPreview" style="color: var(--accent);">report</span>.pdf</div>
    <div class="row">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-confirm" id="confirmBtn">Generate & Download</button>
    </div>
  </div>
</div>

<!-- Hidden sandbox for PDF canvas rendering -->
<div id="renderContainer"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const dropzoneMainText = document.getElementById('dropzoneMainText');
const fileBadgeContainer = document.getElementById('fileBadgeContainer');
const actionBtn = document.getElementById('actionBtn');
const statusMessage = document.getElementById('statusMessage');
const renderContainer = document.getElementById('renderContainer');

const overlay = document.getElementById('overlay');
const filenameInput = document.getElementById('filenameInput');
const extPreview = document.getElementById('extPreview');
const cancelBtn = document.getElementById('cancelBtn');
const confirmBtn = document.getElementById('confirmBtn');

let currentFile = null;
let pdfBlobUrl = null;
let currentTargetFileName = "Converted_Report";

// Drag & drop events
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleIncomingFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleIncomingFile(fileInput.files[0]);
});

function handleIncomingFile(file) {
  if (!file.name.toLowerCase().endsWith('.xlsx')) {
    statusMessage.className = 'status error';
    statusMessage.textContent = 'Please select a valid .xlsx spreadsheet.';
    return;
  }
  currentFile = file;
  pdfBlobUrl = null;

  // Derive default filename without extension
  const defaultName = file.name.replace(/\.[^/.]+$/, "");
  currentTargetFileName = sanitizeName(defaultName) || "Converted_Report";

  dropzoneMainText.textContent = "Selected spreadsheet:";
  fileBadgeContainer.innerHTML = `<span class="selected-file-badge">${file.name}</span>`;

  actionBtn.disabled = false;
  actionBtn.classList.remove('ready');
  actionBtn.textContent = '⇩ Convert to PDF';
  statusMessage.className = 'status';
  statusMessage.textContent = 'File ready. Click "Convert to PDF" to proceed.';
}

// Modal Trigger
actionBtn.addEventListener('click', () => {
  // If already generated, trigger direct download
  if (pdfBlobUrl) {
    downloadCurrentPdf();
    return;
  }

  if (!currentFile) return;

  filenameInput.value = currentTargetFileName;
  extPreview.textContent = currentTargetFileName;
  overlay.classList.add('show');
  setTimeout(() => {
    filenameInput.focus();
    filenameInput.select();
  }, 50);
});

filenameInput.addEventListener('input', () => {
  const v = sanitizeName(filenameInput.value) || 'report';
  extPreview.textContent = v;
});

filenameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    confirmBtn.click();
  }
});

cancelBtn.addEventListener('click', () => overlay.classList.remove('show'));

confirmBtn.addEventListener('click', async () => {
  currentTargetFileName = sanitizeName(filenameInput.value) || 'report';
  overlay.classList.remove('show');
  await processAndBuildPdf();
});

function sanitizeName(name) {
  return name.trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 100);
}

function downloadCurrentPdf() {
  const a = document.createElement('a');
  a.href = pdfBlobUrl;
  a.download = `${currentTargetFileName}.pdf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Core XML Parsing & html2pdf generation
async function processAndBuildPdf() {
  actionBtn.disabled = true;
  actionBtn.textContent = 'Processing...';
  statusMessage.className = 'status';
  statusMessage.textContent = 'Bypassing NaN XML tags & rendering PDF canvas...';

  try {
    const zip = await JSZip.loadAsync(currentFile);

    // Parse Shared Strings
    let sharedStrings = [];
    if (zip.files['xl/sharedStrings.xml']) {
      const ssXml = await zip.files['xl/sharedStrings.xml'].async('text');
      const doc = new DOMParser().parseFromString(ssXml, 'text/xml');
      doc.querySelectorAll('si').forEach(si => {
        const t = si.querySelector('t');
        sharedStrings.push(t ? t.textContent : '');
      });
    }

    // Parse Sheet 1 XML
    const sheetFile = zip.files['xl/worksheets/sheet1.xml'];
    if (!sheetFile) throw new Error("Could not find xl/worksheets/sheet1.xml in archive.");

    const sheetXml = await sheetFile.async('text');
    const doc = new DOMParser().parseFromString(sheetXml, 'text/xml');
    const rows = doc.querySelectorAll('row');

    const extractedRows = [];
    rows.forEach(r => {
      const rowCells = {};
      r.querySelectorAll('c').forEach(c => {
        const ref = c.getAttribute('r') || '';
        const col = ref.replace(/[0-9]/g, '');
        const t = c.getAttribute('t');
        const v = c.querySelector('v');
        let val = v ? v.textContent : '';

        if (val === 'NaN') val = '';
        else if (t === 's' && !isNaN(val)) {
          val = sharedStrings[parseInt(val)] || val;
        }
        rowCells[col] = val.trim();
      });
      if (Object.values(rowCells).some(v => v !== '')) {
        extractedRows.push(rowCells);
      }
    });

    if (extractedRows.length < 2) throw new Error("Not enough data rows found in spreadsheet.");

    // Build Formatted HTML Table
    const headerRow = extractedRows[0];
    const cols = Object.keys(headerRow).sort((a, b) => (a.length - b.length) || a.localeCompare(b));
    const dataRows = extractedRows.slice(1);

    let approvedCount = 0;
    let pendingCount = 0;
    let totalDaysCount = 0;
    let applicant = "Employee Record";

    const thTags = cols.map(c => `<th style="padding: 7px 6px; background: #0f172a; color: #ffffff; text-align: left; font-size: 7.5pt; text-transform: uppercase;">${headerRow[c] || c}</th>`).join('');

    const trTags = dataRows.map((r, idx) => {
      if (r['B']) applicant = r['B'];
      const status = r['J'] || '';
      const days = parseFloat(r['G']) || 0;
      if (status.toLowerCase().includes('approv')) approvedCount++;
      else if (status.toLowerCase().includes('pend')) pendingCount++;
      totalDaysCount += days;

      const tdTags = cols.map(c => {
        let val = r[c] || '';
        if (c === 'A') val = idx + 1;
        if (c === 'J') {
          const isApproved = val.toLowerCase().includes('approv');
          const style = isApproved ? "background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0;" : "background: #fef3c7; color: #b45309; border: 1px solid #fde68a;";
          return `<td style="padding: 6px; text-align: center;"><span style="padding: 2px 7px; border-radius: 10px; font-weight: bold; font-size: 7pt; ${style}">${val}</span></td>`;
        }
        if (c === 'C') {
          return `<td style="padding: 6px;"><span style="background: #f1f5f9; color: #334155; padding: 2px 6px; border-radius: 4px; font-size: 7pt;">${val}</span></td>`;
        }
        if (c === 'G') {
          return `<td style="padding: 6px; text-align: center; font-weight: bold; color: #0f172a;">${val}</td>`;
        }
        if (c === 'D' && val.includes('\n')) {
          const [d1, d2] = val.split('\n');
          return `<td style="padding: 6px;"><div>${d1}</div><div style="font-size: 6.5pt; color: #64748b;">${d2}</div></td>`;
        }
        return `<td style="padding: 6px; color: #334155;">${val}</td>`;
      }).join('');

      return `<tr style="border-bottom: 1px solid #e2e8f0; ${idx % 2 === 1 ? 'background: #fbfcfe;' : ''}">${tdTags}</tr>`;
    }).join('');

    renderContainer.innerHTML = `
      <div style="background: white; padding: 18px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 8pt; color: #1e293b;">
        <div style="display: table; width: 100%; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px;">
          <div style="display: table-cell; vertical-align: middle;">
            <h2 style="margin: 0; font-size: 14pt; color: #0f172a; font-weight: 800;">Leave Applications Record</h2>
            <p style="margin: 2px 0 0 0; color: #64748b; font-size: 7.5pt;">Employee Leave Request Summary & Audit Log</p>
          </div>
          <div style="display: table-cell; text-align: right; vertical-align: middle;">
            <div style="font-weight: bold; font-size: 8.5pt; color: #0f172a;">APPLICANT: ${applicant}</div>
            <div style="color: #94a3b8; font-size: 7pt; margin-top: 2px;">Official Document</div>
          </div>
        </div>

        <div style="display: table; width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 12px; padding: 8px;">
          <div style="display: table-cell; width: 25%; text-align: center; border-right: 1px solid #e2e8f0;">
            <div style="font-size: 6.5pt; text-transform: uppercase; color: #64748b; font-weight: bold;">Total Applications</div>
            <div style="font-size: 11pt; font-weight: bold; color: #0f172a; margin-top: 2px;">${dataRows.length}</div>
          </div>
          <div style="display: table-cell; width: 25%; text-align: center; border-right: 1px solid #e2e8f0;">
            <div style="font-size: 6.5pt; text-transform: uppercase; color: #64748b; font-weight: bold;">Approved</div>
            <div style="font-size: 11pt; font-weight: bold; color: #15803d; margin-top: 2px;">${approvedCount}</div>
          </div>
          <div style="display: table-cell; width: 25%; text-align: center; border-right: 1px solid #e2e8f0;">
            <div style="font-size: 6.5pt; text-transform: uppercase; color: #64748b; font-weight: bold;">Pending</div>
            <div style="font-size: 11pt; font-weight: bold; color: #b45309; margin-top: 2px;">${pendingCount}</div>
          </div>
          <div style="display: table-cell; width: 25%; text-align: center;">
            <div style="font-size: 6.5pt; text-transform: uppercase; color: #64748b; font-weight: bold;">Total Days</div>
            <div style="font-size: 11pt; font-weight: bold; color: #0f172a; margin-top: 2px;">${totalDaysCount} Days</div>
          </div>
        </div>

        <table style="width: 100%; border-collapse: collapse; font-size: 7.5pt;">
          <thead><tr>${thTags}</tr></thead>
          <tbody>${trTags}</tbody>
        </table>
      </div>
    `;

    const opt = {
      margin: 6,
      filename: `${currentTargetFileName}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    const pdfBlob = await html2pdf().set(opt).from(renderContainer.firstElementChild).output('blob');
    pdfBlobUrl = window.URL.createObjectURL(pdfBlob);

    // Auto download immediately with custom name
    downloadCurrentPdf();

    // Set UI to Ready/Re-download State
    actionBtn.disabled = false;
    actionBtn.classList.add('ready');
    actionBtn.textContent = '⇩ Download Again';

    statusMessage.className = 'status success';
    statusMessage.textContent = `✓ "${currentTargetFileName}.pdf" downloaded successfully.`;

  } catch (err) {
    alert("Conversion error: " + err.message);
    actionBtn.disabled = false;
    actionBtn.textContent = '⇩ Convert to PDF';
    statusMessage.className = 'status error';
    statusMessage.textContent = 'Conversion failed: ' + err.message;
  }
}
</script>
</body>
</html>
